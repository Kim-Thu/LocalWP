name: Generate backlog

on:
  push:
    branches: [maint/bootstrap-project-20260806-0542]
    paths:
      - planning/EPIC_CATALOG.json
      - scripts/generate_backlog.py
      - .github/workflows/generate-backlog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Generate 1220 task files
        run: python scripts/generate_backlog.py
      - name: Verify generated backlog
        shell: bash
        run: |
          count=$(find tasks/backlog -maxdepth 1 -name 'T*.md' | wc -l)
          test "$count" -eq 1220
          test -f MASTER_TASK_PLAN.md
          test -f planning/epics/E17/README.md
      - name: Commit generated backlog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER_TASK_PLAN.md planning/epics tasks/backlog
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(tasks): generate complete 1220-task backlog"
          git push
