name: Security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect C# solution
        id: detect
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
          if ($null -eq $solution) {
            "has_solution=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No .NET solution exists yet. Skipping CodeQL C# analysis."
          }
          else {
            "has_solution=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "solution=$($solution.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Initialize CodeQL
        if: steps.detect.outputs.has_solution == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Set up .NET
        if: steps.detect.outputs.has_solution == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet restore "${{ steps.detect.outputs.solution }}"

      - name: Build for CodeQL
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet build "${{ steps.detect.outputs.solution }}" --configuration Release --no-restore

      - name: Analyze with CodeQL
        if: steps.detect.outputs.has_solution == 'true'
        uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
