name: localwp-dev-validation

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./fixtures/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixtures/wordpress:/var/www/html:ro
    depends_on:
      php:
        condition: service_healthy

  php:
    image: wordpress:php8.3-fpm-alpine
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: localwp
      WORDPRESS_DB_USER: localwp
      WORDPRESS_DB_PASSWORD: localwp-dev-only
    volumes:
      - ./fixtures/wordpress:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: localwp
      MYSQL_USER: localwp
      MYSQL_PASSWORD: localwp-dev-only
      MYSQL_ROOT_PASSWORD: root-dev-only
    volumes:
      - localwp-dev-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot-dev-only"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  localwp-dev-db:
